name: Build and Release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Per-plugin path-based change detection.
  #
  # On a pull_request, inspect the diff against the base branch and decide
  # which plugins were actually touched. Each plugin's build step is then
  # gated by `needs.changes.outputs.<plugin> == 'true' || shared == 'true'`,
  # so a PR that only modifies z80/ skips mc6809 / em8 / mc68030 / z8000.
  #
  # For ANY non-PR event (tag push, workflow_dispatch) the detect step
  # short-circuits to every output being true — releases and manual runs
  # always build everything, no matter what the diff says. The release
  # path is additionally guarded by a sanity-check step further below
  # that fails the build if any expected DLL is missing.
  #
  # `has_code` is preserved for the docs-only bypass introduced in #40:
  # when ALL outputs are false (PR touched only **/*.md / LICENSE), the
  # build job is skipped entirely and the required `build` status is
  # treated as success.
  changes:
    runs-on: ubuntu-latest
    outputs:
      has_code: ${{ steps.detect.outputs.has_code }}
      shared:   ${{ steps.detect.outputs.shared }}
      mc6809:   ${{ steps.detect.outputs.mc6809 }}
      em8:      ${{ steps.detect.outputs.em8 }}
      mc68030:  ${{ steps.detect.outputs.mc68030 }}
      z8000:    ${{ steps.detect.outputs.z8000 }}
      z80:      ${{ steps.detect.outputs.z80 }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Detect per-plugin changes
        id: detect
        shell: bash
        run: |
          # Non-PR events: build everything.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a PR (event=${{ github.event_name }}) — building all plugins"
            {
              echo "has_code=true"
              echo "shared=true"
              echo "mc6809=true"
              echo "em8=true"
              echo "mc68030=true"
              echo "z8000=true"
              echo "z80=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED"

          detect() {
            # detect <pattern> — print "true" if any changed file matches.
            if echo "$CHANGED" | grep -qE "$1"; then
              echo "true"
            else
              echo "false"
            fi
          }

          # Shared: anything that affects every plugin's build. api/ is
          # the ABI header, .github/ holds this workflow, installer/ is
          # the release-only Inno Setup recipe. Anything matching here
          # forces a full build, ignoring per-plugin diffs.
          shared=$(detect '^(api/|\.github/|installer/)')

          # Per-plugin directories. mc68030 also depends on the
          # em68030_WinUI3Cpp submodule pulled in under external/.
          mc6809=$(detect '^mc6809/')
          em8=$(detect '^em8/')
          mc68030=$(detect '^(mc68030/|external/em68030_WinUI3Cpp/)')
          z8000=$(detect '^z8000/')
          z80=$(detect '^z80/')

          # has_code is true if anything code-relevant changed.
          if [ "$shared" = "true" ] || \
             [ "$mc6809" = "true" ] || \
             [ "$em8" = "true" ] || \
             [ "$mc68030" = "true" ] || \
             [ "$z8000" = "true" ] || \
             [ "$z80" = "true" ]; then
            has_code=true
          else
            has_code=false
          fi

          echo "Per-plugin: mc6809=$mc6809 em8=$em8 mc68030=$mc68030 z8000=$z8000 z80=$z80"
          echo "Shared=$shared  has_code=$has_code"

          {
            echo "has_code=$has_code"
            echo "shared=$shared"
            echo "mc6809=$mc6809"
            echo "em8=$em8"
            echo "mc68030=$mc68030"
            echo "z8000=$z8000"
            echo "z80=$z80"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [changes]
    if: needs.changes.outputs.has_code == 'true'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout emfe_plugins
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Fetch submodules (Em68030_WinUI3Cpp)
        shell: bash
        run: git submodule update --init --recursive

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $ver = "0.0.0"
          if ("${{ github.ref }}" -match "^refs/tags/v(.+)$") {
            $ver = $Matches[1]
          } else {
            # `git describe` errors when no tag exists yet — don't fail the step.
            try {
              $desc = & git describe --tags --abbrev=0 2>$null
              if ($LASTEXITCODE -eq 0 -and $desc -match "^v(.+)$") {
                $ver = $Matches[1]
              }
            } catch {}
            $global:LASTEXITCODE = 0
          }
          echo "APP_VERSION=$ver" >> $env:GITHUB_OUTPUT

      # Per-plugin build steps are gated by the change-detection outputs.
      # Each step builds if EITHER (a) its own plugin directory changed,
      # OR (b) something shared (api/, .github/, installer/) changed and
      # therefore every plugin must rebuild.
      #
      # Tag pushes and workflow_dispatch land here with all outputs set
      # to "true" via the changes job's non-PR short-circuit.

      - name: Build mc6809 (Rust)
        if: needs.changes.outputs.mc6809 == 'true' || needs.changes.outputs.shared == 'true'
        working-directory: mc6809
        run: cargo build --release

      - name: Configure & build em8 (CMake)
        if: needs.changes.outputs.em8 == 'true' || needs.changes.outputs.shared == 'true'
        working-directory: em8
        run: |
          cmake -S . -B build
          cmake --build build --config Release

      - name: Configure & build mc68030 (CMake)
        if: needs.changes.outputs.mc68030 == 'true' || needs.changes.outputs.shared == 'true'
        working-directory: mc68030
        run: |
          cmake -S . -B build
          cmake --build build --config Release

      - name: Configure & build z8000 (CMake)
        if: needs.changes.outputs.z8000 == 'true' || needs.changes.outputs.shared == 'true'
        working-directory: z8000
        run: |
          cmake -S . -B build
          cmake --build build --config Release

      - name: Configure & build z80 (CMake)
        if: needs.changes.outputs.z80 == 'true' || needs.changes.outputs.shared == 'true'
        working-directory: z80
        run: |
          cmake -S . -B build
          cmake --build build --config Release

      - name: Collect plugin DLLs
        shell: bash
        run: |
          SHORT_HASH=$(git rev-parse --short HEAD)
          echo "SHORT_HASH=${SHORT_HASH}" >> "$GITHUB_ENV"
          # Stage under dist/plugins/ so the release zip can be
          # extracted next to emfe.exe without further rearrangement.
          mkdir -p dist/plugins

          # Per-plugin defensive copy: a PR that only touched (say) z80
          # leaves the other plugins unbuilt. The release sanity check
          # below catches accidental misses on tag pushes; for PRs the
          # smaller dist/plugins/ is intentional and correct.
          copy_if_exists() {
            local src="$1"
            if [ -f "$src" ]; then
              cp "$src" dist/plugins/
              echo "Copied: $src"
            else
              echo "Skipped (not built this run): $src"
            fi
          }
          copy_if_exists mc6809/target/release/emfe_plugin_mc6809.dll
          copy_if_exists em8/build/bin/Release/emfe_plugin_em8.dll
          copy_if_exists mc68030/build/bin/Release/emfe_plugin_mc68030.dll
          copy_if_exists z8000/build/bin/Release/emfe_plugin_z8000.dll
          # z80 is added to this list (and to the sanity check below)
          # once Phase 1.7 ships real functionality and the DLL is
          # ready for end users.

          ls -l dist/plugins/

      - name: Sanity-check release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # On a release tag push the change-detection job has set every
          # per-plugin output to 'true', so all plugins should have been
          # built and copied above. This step belt-and-braces verifies
          # that — fail fast before any release / installer is touched.
          expected=(
            emfe_plugin_mc6809.dll
            emfe_plugin_em8.dll
            emfe_plugin_mc68030.dll
            emfe_plugin_z8000.dll
          )
          # NOTE: keep this list in lockstep with `Collect plugin DLLs`
          # above. When z80 starts shipping (Phase 1.7), add it here AND
          # in the copy_if_exists list.

          missing=0
          for f in "${expected[@]}"; do
            if [ ! -f "dist/plugins/$f" ]; then
              echo "::error::Missing release artifact: $f"
              missing=$((missing+1))
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "::error::Release would be incomplete ($missing missing). Aborting before any release artifact is created."
            exit 1
          fi
          echo "All ${#expected[@]} release artifacts present:"
          ls -l dist/plugins/

      - name: Compile installer (Inno Setup)
        shell: pwsh
        run: |
          # Inno Setup 6 is preinstalled on windows-latest runners; iscc is on PATH.
          # Pass APP_VERSION so the setup.exe filename and embedded version match
          # the release tag (or 0.0.0 for non-tag PR/dispatch runs).
          iscc /DAppVersion=${{ steps.version.outputs.APP_VERSION }} installer\emfe_plugins.iss
          Get-ChildItem dist\

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emfe-plugins-${{ env.SHORT_HASH }}
          path: dist/plugins/*.dll
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emfe-plugins-installer-${{ env.SHORT_HASH }}
          path: dist/emfe_plugins-*-setup.exe
          if-no-files-found: error

      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          ZIP="emfe-plugins-${TAG}-${SHORT_HASH}.zip"
          # Zip the `plugins/` directory (not its contents) so the
          # archive holds `plugins/*.dll` paths — extractable directly
          # next to emfe.exe.
          cd dist
          7z a -tzip "../${ZIP}" plugins > /dev/null
          cd ..
          echo "ZIP_NAME=${ZIP}" >> "$GITHUB_ENV"
          ls -l "${ZIP}"
          echo "--- zip contents ---"
          7z l "${ZIP}"

      - name: Virus scan release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # Invoke Defender via MpCmdRun.exe (the standalone CLI) rather than
          # the PowerShell `Defender` module's cmdlets (Start-MpScan etc.).
          # The module wraps WMI/COM and exhibits sporadic "Provider load
          # failure" on GitHub-hosted Windows runners under pwsh 7; the .exe
          # is the underlying engine entry point and is unaffected.
          $mpCmdRun = "C:\Program Files\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mpCmdRun)) {
            Write-Error "MpCmdRun.exe not found at $mpCmdRun"
            exit 1
          }
          # Resolve installer setup.exe path (filename embeds APP_VERSION).
          $setupExe = Get-ChildItem dist\emfe_plugins-*-setup.exe | Select-Object -First 1
          if (-not $setupExe) {
            Write-Error "setup.exe not found under dist\"
            exit 1
          }
          echo "SETUP_EXE_NAME=$($setupExe.Name)" >> $env:GITHUB_ENV
          echo "SETUP_EXE_PATH=$($setupExe.FullName)" >> $env:GITHUB_ENV
          Write-Host "Scanning release artifacts with Windows Defender (MpCmdRun.exe)..."
          # Signature update — best-effort; runner-side failures should not
          # fail the build, the scan still runs with whatever signatures
          # are currently loaded.
          & $mpCmdRun -SignatureUpdate
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Signature update failed (exit $LASTEXITCODE), continuing with stale signatures"
          }
          # MpCmdRun exit codes:
          #   0 = no malware found
          #   2 = malware detected
          #   other = engine error
          foreach ($target in @("$PWD\${env:ZIP_NAME}", $setupExe.FullName)) {
            Write-Host "Scanning: $target"
            & $mpCmdRun -Scan -ScanType 3 -File $target -DisableRemediation
            switch ($LASTEXITCODE) {
              0 { Write-Host "  -> clean" }
              2 { Write-Error "  -> threat detected (MpCmdRun exit 2)"; exit 1 }
              default {
                Write-Error "  -> scan engine error (exit $LASTEXITCODE)"
                exit $LASTEXITCODE
              }
            }
          }
          Write-Host "All scans passed: no threats detected."

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          # Auto-generate "What's Changed" — PRs merged between the previous
          # v* tag and this one. Returns empty body for the very first release,
          # which just renders an empty section under the separator.
          AUTO_NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -F tag_name="$TAG" --jq .body 2>/dev/null || true)
          # Delete existing release if tag was moved to a new commit.
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" "${ZIP_NAME}" "${SETUP_EXE_PATH}" --title "$TAG" --notes "$(cat <<EOF
          ## emfe_plugins ${TAG}

          Pre-built Windows x64 plugin DLLs for the emfe emulator frontend.

          ### Assets
          - **${SETUP_EXE_NAME}** — Inno Setup installer (recommended). Per-user, no admin / UAC elevation required. Auto-detects which host frontend (emfe_WinUI3Cpp / emfe_CsWPF) is installed and offers component-level selection.
          - **${ZIP_NAME}** — zip of the four plugin DLLs for manual install.

          ### DLLs (in either asset)
          - \`emfe_plugin_mc6809.dll\` — Motorola 6809 (wraps em6809-core Rust crate)
          - \`emfe_plugin_mc68030.dll\` — Motorola 68030 (reuses em68030_WinUI3Cpp core)
          - \`emfe_plugin_z8000.dll\` — Zilog Z8000 family (Z8001/Z8002/Z8003/Z8004)
          - \`emfe_plugin_em8.dll\` — em8 minimal 8-bit CPU (ABI validation target)

          ### Installation

          **Option 1 (recommended) — Installer**
          Download \`${SETUP_EXE_NAME}\` and run it. Per-user install, no admin required. The installer copies the DLLs to:
          \`\`\`
          %LOCALAPPDATA%\\emfe_WinUI3Cpp\\plugins\\
          %LOCALAPPDATA%\\emfe_CsWPF\\plugins\\
          \`\`\`
          The host scans both the system \`plugins/\` directory next to \`emfe.exe\` and the per-user directory above; the per-user copy wins on filename collisions.

          **Option 2 — Manual zip**
          Extract \`${ZIP_NAME}\` into \`%LOCALAPPDATA%\\emfe_WinUI3Cpp\\\` and/or \`%LOCALAPPDATA%\\emfe_CsWPF\\\` — whichever host frontends ([emfe_WinUI3Cpp](https://github.com/hha0x617/emfe_WinUI3Cpp) / [emfe_CsWPF](https://github.com/hha0x617/emfe_CsWPF)) you have installed. The zip's top-level \`plugins/\` directory lands directly under each, matching what the installer produces. Example layout for emfe_WinUI3Cpp (the \`%LOCALAPPDATA%\\emfe_CsWPF\\\` tree is identical):
          \`\`\`
          %LOCALAPPDATA%\\emfe_WinUI3Cpp\\
          └── plugins\\
              ├── emfe_plugin_mc6809.dll
              ├── emfe_plugin_mc68030.dll
              ├── emfe_plugin_z8000.dll
              └── emfe_plugin_em8.dll
          \`\`\`
          No admin / UAC elevation required. The host also scans a system \`plugins/\` directory next to \`emfe.exe\`, so for portable / dev-built hosts you can extract there instead — but for installer-deployed hosts in \`%ProgramFiles%\\\` you would need admin to write there, so the per-user path above is the right default.

          ### Security
          - Virus scan: **Passed** (Windows Defender, signatures updated at build time; both setup.exe and zip scanned)

          ### Source Code (Apache-2.0 / MIT dual)
          - **Repository**: [emfe_plugins](https://github.com/${{ github.repository }})
          - **Build workflow**: [.github/workflows/build.yml](https://github.com/${{ github.repository }}/blob/${TAG}/.github/workflows/build.yml)

          Upstream CPU cores:
          - [em6809-core](https://github.com/hha0x617/em6809-core) (MIT OR Apache-2.0) — pinned via Cargo \`git\` rev (see \`mc6809/Cargo.toml\`)
          - [Em68030_WinUI3Cpp](https://github.com/hha0x617/Em68030_WinUI3Cpp) (Apache-2.0) — pinned via submodule (\`external/em68030_WinUI3Cpp\`)

          ---

          ${AUTO_NOTES}
          EOF
          )"
